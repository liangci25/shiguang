<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>创建群聊</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/new-group.css">
</head>
<body>
<div class="phone">
  <header class="page-head">
    <a class="head-back" href="index.html">‹</a>
    <div class="head-title">创建群聊</div>
  </header>
  <main class="page-body group-form">
    <div class="field">
      <label>群名 <span class="required">*</span></label>
      <input type="text" id="ng-name" maxlength="12" placeholder="给群起个名字">
    </div>
    <div class="field">
      <label>群头像（点击头像：拍照 / 本地图片 / 图片链接）</label>
      <div class="avatar-pick">
        <div class="avatar avatar-big" id="ng-avatar"></div>
      </div>
    </div>
    <div class="field">
      <label>选择群成员 <span class="required">*</span>（已勾选 <span id="ng-count">0</span> 位 · 群内共 <span id="ng-total">1</span> 人，含你）</label>
      <div class="member-pick" id="ng-members"></div>
    </div>
    <button class="btn btn-primary btn-block" id="ng-save">保存并开始聊天</button>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script src="../js/common.js"></script>
<script src="../js/new-group.js"></script>
</body>
</html>
