<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拾光 · 设置</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/settings.css">
</head>
<body>
<div class="phone">
  <header class="page-head">
    <div class="head-title">设置</div>
  </header>
  <main class="page-body">
    <div class="set-group">
      <div class="set-item" id="exportBtn" data-act="export">
        <div class="set-label">导出备份</div>
        <div class="set-desc">把所有角色、会话、聊天记录、词库保存为 JSON 文件</div>
      </div>
      <div class="set-item" id="importBtn" data-act="import">
        <div class="set-label">导入备份</div>
        <div class="set-desc">从备份文件恢复全部数据（会覆盖当前数据）</div>
      </div>
      <div class="set-item danger" id="resetBtn" data-act="reset">
        <div class="set-label">清空全部数据</div>
        <div class="set-desc">删除所有角色、会话、聊天记录和词库，回到首次状态</div>
      </div>
    </div>
    <div class="set-group">
      <div class="set-about">
        <div class="set-about-title">拾光 · 模拟小手机对话</div>
        <div class="set-desc">本地聊天网站：所有数据只保存在你的浏览器里，不上传任何服务器。</div>
        <div class="set-desc">v0.3 · 词库系统版</div>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </main>
  <nav class="tab-bar">
    <a class="tab-item" href="index.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.6 1.3 5 3.4 6.6-.1.9-.4 2.4-1.5 3.4 0 0 2.4-.2 4.2-1.6.6.2 1.3.3 2 .3 1.8 0 3.4-.5 4.8-1.3h.1c2.6-1.6 4.4-4.3 4.4-7.4C19 6.9 15.5 3 12 3z"/></svg>
      <span>聊天</span>
      <span class="tab-badge" id="navChatBadge">0</span>
    </a>
    <a class="tab-item" href="library.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
      <span>词库</span>
    </a>
    <a class="tab-item active" href="settings.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.1 12.9a7.2 7.2 0 0 0 .1-1.8 7.2 7.2 0 0 0-.1-1.8l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l2.4-1a7.3 7.3 0 0 0-3.1-1.8L12.9.9a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.5a7.3 7.3 0 0 0-3.1 1.8l2.4-1a.5.5 0 0 0-.6.2L.7 7.7a.5.5 0 0 0 .1.6l2 1.6a7.2 7.2 0 0 0-.1 1.8 7.2 7.2 0 0 0 .1 1.8l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3a.5.5 0 0 0 .6.2l2.4-1a7.3 7.3 0 0 0 3.1 1.8l.4 2.5a.5.5 0 0 0 .5.4h3.8a.5.5 0 0 0 .5-.4l.4-2.5a7.3 7.3 0 0 0 3.1-1.8l2.4 1a.5.5 0 0 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6zM12 16a4 4 0 1 1 4-4 4 4 0 0 1-4 4z"/></svg>
      <span>设置</span>
    </a>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script src="../js/common.js"></script>
<script src="../js/settings.js"></script>
</body>
</html>
